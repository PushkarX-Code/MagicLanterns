# Builds Magic Lanterns for Windows: the installer (direct download, updates itself) and the Microsoft Store
# package (updated by the Store). Pushing a tag like v1.0.0 builds and publishes; running it by hand from the
# Actions tab can build only, to check a release before it goes out.
#
# Publishing: the installer, latest.yml (the update feed) and install.ps1 go to this repo's public Releases,
# where the download links and the in-app updater read them. The Store package is never published here:
# download it from the run's artifacts and upload it in Partner Center.
#
# Store identity: set the repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_NAME
# to the values in Partner Center → Product identity. Without them the package uses placeholders that the
# Store will reject (fine for a test build).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. v1.0.1 (must be higher than the last release for updates to reach people)'
        required: true
        default: 'v1.0.0'
      notes:
        description: 'What this update brings (shown in the in-app update prompt)'
        required: false
        default: ''
      publish:
        description: 'Publish the release (untick to only build and download the files)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
      # With META_PROXY_URL set (the deployed worker/), no key is built into the app at all.
      # Without it, the keys are built in scrambled. Both are optional; the library works without them.
      MAIN_VITE_META_PROXY_URL: ${{ secrets.META_PROXY_URL }}
      MAIN_VITE_TMDB_API_KEY: ${{ secrets.META_PROXY_URL == '' && secrets.TMDB_API_KEY || '' }}
      MAIN_VITE_OMDB_API_KEY: ${{ secrets.META_PROXY_URL == '' && secrets.OMDB_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The installer, the Store package, the in-app version and the update feed all take the tag's version.
      - name: Stamp version
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      - name: Build installer and Store package
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: |
          args=()
          [ -n "$STORE_IDENTITY_NAME" ] && args+=("-c.appx.identityName=$STORE_IDENTITY_NAME")
          [ -n "$STORE_PUBLISHER" ] && args+=("-c.appx.publisher=$STORE_PUBLISHER")
          [ -n "$STORE_PUBLISHER_NAME" ] && args+=("-c.appx.publisherDisplayName=$STORE_PUBLISHER_NAME")
          npx electron-builder --win --publish never "${args[@]}"

      - uses: actions/upload-artifact@v5
        with:
          name: magic-lanterns-${{ env.VERSION }}
          path: |
            release/MagicLanterns-Setup.exe
            release/MagicLanterns-Store.appx
          if-no-files-found: error

      # latest.yml and the blockmap let installed copies find, verify and download only what changed.
      - name: Publish the release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Magic Lanterns ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: ${{ github.event.inputs.notes == '' }}
          files: |
            release/MagicLanterns-Setup.exe
            release/MagicLanterns-Setup.exe.blockmap
            release/latest.yml
            docs/install.ps1
