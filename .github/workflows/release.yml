# Builds the Windows installer and publishes it as a GitHub Release.
# Installers go to the public MagicLanterns-Releases repo (installers only, no code), so this repo stays private
# while downloads and in-app updates work for everyone. That needs the RELEASES_TOKEN secret: a fine-grained
# token with Contents: Read and write on MagicLanterns-Releases. Without it the release stays in this repo.
# Run it from the Actions tab (Release → Run workflow) or by pushing a tag like v0.1.0.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v0.2.0 (must be higher than the last release for updates to reach people)'
        required: true
        default: 'v0.1.0'
      notes:
        description: 'What this update brings (shown in the in-app update prompt). Leave empty to list merged changes.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # With META_PROXY_URL set (the deployed worker/), no key is built into the app at all.
      # Without it, the keys are built in scrambled. Both are optional; the library works without them.
      MAIN_VITE_META_PROXY_URL: ${{ secrets.META_PROXY_URL }}
      MAIN_VITE_TMDB_API_KEY: ${{ secrets.META_PROXY_URL == '' && secrets.TMDB_API_KEY || '' }}
      MAIN_VITE_OMDB_API_KEY: ${{ secrets.META_PROXY_URL == '' && secrets.OMDB_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The installer, the in-app version and the update feed all take their version from the tag.
      - name: Stamp version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
      - name: Pick where the release goes
        id: target
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
      # latest.yml and the blockmap let installed copies find, verify and download only what changed.
      - name: Publish to MagicLanterns-Releases
        if: steps.target.outputs.public == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: PushkarX-Code/MagicLanterns-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Magic Lanterns ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ github.event.inputs.notes || 'Bug fixes and improvements.' }}
          files: |
            release/MagicLanterns-Setup.exe
            release/MagicLanterns-Setup.exe.blockmap
            release/latest.yml
      - name: Publish here (no RELEASES_TOKEN yet)
        if: steps.target.outputs.public != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Magic Lanterns ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: ${{ github.event.inputs.notes == '' }}
          files: |
            release/MagicLanterns-Setup.exe
            release/MagicLanterns-Setup.exe.blockmap
            release/latest.yml
