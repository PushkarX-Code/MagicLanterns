appId: com.pushkar.magiclanterns
productName: Magic Lanterns
copyright: Made by Pushkar
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# The file reader and frame grabber are programs, not scripts; they have to sit outside the app archive to run.
asarUnpack:
  - node_modules/@ffprobe-installer/**
  - node_modules/ffmpeg-static/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Magic Lanterns
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Fixed name so "releases/latest/download/MagicLanterns-Setup.exe" always points at the newest build.
  artifactName: MagicLanterns-Setup.${ext}
# Update feed: installed copies check the public MagicLanterns-Releases repo (installers only) at launch.
publish:
  provider: github
  owner: PushkarX-Code
  repo: MagicLanterns-Releases
